# Mirrors CI locally: the same checks run before a commit as after a push.
repos:
  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: python3 -m unittest discover -s tests
        language: system
        pass_filenames: false
      - id: byte-compile
        name: byte-compile sources
        entry: python3 -m compileall -q src
        language: system
        pass_filenames: false
